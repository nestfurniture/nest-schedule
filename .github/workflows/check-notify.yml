# 알림 서버(notify)와 체크리스트가 잘 연결됐는지 점검합니다. Actions 탭에서 수동으로만 실행돼요.
name: 알림 서버 점검
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: notify 서버와 SQL 확인
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js)
          ORIGIN=https://nestfurniture.github.io
          echo "== 1. 미리 확인(OPTIONS)"
          curl -s -i -m 30 -X OPTIONS "$URL/functions/v1/notify" -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info" | head -20
          echo; echo "== 2. 공개키 요청(POST key)"
          curl -s -i -m 60 -X POST "$URL/functions/v1/notify" -H "Origin: $ORIGIN" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{"action":"key"}' | head -30
          echo; echo "== 3. 알림 기기 표(push_subs)"
          curl -s -i -m 30 "$URL/rest/v1/push_subs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | grep -E "^HTTP|PGRST|\[" | head -5
          echo; echo "== 4. 체크리스트 표(checklists, 업데이트 4) — [] 이면 준비됨"
          curl -s -i -m 30 "$URL/rest/v1/checklists?select=job_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | grep -E "^HTTP|PGRST|\[" | head -5
          echo; echo "== 5. 체크리스트 서버(cl_open) — 404 not found 이면 새 코드, 400 unknown action 이면 예전 코드"
          curl -s -i -m 60 -X POST "$URL/functions/v1/notify" -H "Origin: $ORIGIN" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{"action":"cl_open","token":"probe_aaaaaaaaaaaaaaaa"}' | grep -E "^HTTP|error" | head -5
          echo; echo "== 6. 시방서 보관함 표(app_specs, 업데이트 5) — [] 이면 준비됨 (로그인 안 한 요청이라 내용은 안 보임)"
          curl -s -i -m 30 "$URL/rest/v1/app_specs?select=model_key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | grep -E "^HTTP|PGRST|\[" | head -5
          echo; echo "== 7. 시방서 자동 찾기(spec_status) — auto:true 이면 키가 들어감, auto:false 면 키 없음, v:2 이면 새 방식(업데이트 6) 코드, unknown action 이면 예전 코드"
          curl -s -i -m 60 -X POST "$URL/functions/v1/notify" -H "Origin: $ORIGIN" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{"action":"spec_status"}' | grep -E "^HTTP|auto|error" | head -5
          echo; echo "== 8. 시방서 출처 칸(업데이트 6) — [] 이면 준비됨, 42703(column does not exist) 이면 update-06.sql 실행 필요"
          curl -s -i -m 30 "$URL/rest/v1/app_specs?select=official,source,ver&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | grep -E "^HTTP|PGRST|42703|\[" | head -5
          echo; echo "== 9. 서버 내부 이어 찾기(spec_step) — 403 forbidden 이면 바깥에서 못 부르게 잘 막힘"
          curl -s -i -m 60 -X POST "$URL/functions/v1/notify" -H "Origin: $ORIGIN" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{"action":"spec_step","st":{"key":"PROBE1"}}' | grep -E "^HTTP|error" | head -5
