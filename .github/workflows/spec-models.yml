# 앱 현장에 적어 둔 가전 모델명 목록(모델명·종류만)을 보여줍니다. Claude가 시방서를 찾을 때 씁니다. 수동으로만 실행돼요.
name: 시방서 찾을 모델
on: workflow_dispatch
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 모델 목록 받기
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js)
          curl -s -m 30 -X POST "$URL/rest/v1/rpc/spec_models" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' > models.json
          python3 - <<'PY'
          import json, re
          key = lambda s: re.sub(r'[^0-9A-Z가-힣]', '', (s or '').upper())
          rows = json.load(open('models.json'))
          if not isinstance(rows, list):
              print('모델 목록을 받지 못했어요 (업데이트 5 SQL을 실행했는지 확인):', json.dumps(rows, ensure_ascii=False)); raise SystemExit(0)
          lib = json.load(open('specs.json')).get('models', {})
          todo = [r for r in rows if key(r.get('model')) not in lib]
          print(f'== 앱에 적힌 모델 {len(rows)}개, 아직 안 찾은 모델 {len(todo)}개')
          print('TODO_JSON ' + json.dumps(todo, ensure_ascii=False))
          print('ALL_JSON ' + json.dumps(rows, ensure_ascii=False))
          PY
