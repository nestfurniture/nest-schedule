<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>견적서 · 네스트퍼니처</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1C1A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 고객용 견적서: 종이 한 장처럼 보여 주고, 아래 고정 줄에서 인쇄(PDF 저장)·전화 */
:root{
  --bg:#F6F4EE; --surface:#FCFBF8; --line:#DCD6CA; --fg:#2B2A28; --muted:#6E655B; --accent:#A9471C; --accent-fg:#F6F4EE;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Cormorant Garamond",Georgia,"Noto Serif KR",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1C1A; --surface:#2A2724; --line:#3D3833; --fg:#F1E8DA; --muted:#B3A897; --accent:#D9733F; --accent-fg:#1E1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1C1A; --surface:#2A2724; --line:#3D3833; --fg:#F1E8DA; --muted:#B3A897; --accent:#D9733F; --accent-fg:#1E1C1A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding:max(18px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.paper{border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.state{padding:28px 0;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center}
.bar-in{max-width:860px;width:100%;display:flex;gap:8px;align-items:center}
.btn{font:inherit;cursor:pointer;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:11px 16px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:1}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  .bar,.hint{display:none!important}
  .paper{border:0;box-shadow:none;border-radius:0}
}
</style>
<style id="edCss"></style>
</head>
<body>
<div class="wrap">
  <div class="state" id="state">견적서를 불러오는 중…</div>
  <div class="paper" id="paper" hidden></div>
  <p class="hint" id="hint" hidden>PDF로 받으려면 <b>인쇄 · PDF 저장</b>을 누르고, 컴퓨터는 'PDF로 저장', 휴대폰은 인쇄 화면의 공유 버튼에서 저장하시면 돼요.</p>
</div>
<div class="bar" id="bar" hidden><div class="bar-in">
  <button class="btn" type="button" id="printBtn">인쇄 · PDF 저장</button>
  <a class="btn ghost" id="telBtn" hidden>전화하기</a>
</div></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="estimate.js"></script>
<script src="est.js"></script>
</body>
</html>
